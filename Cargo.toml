[package]
name = "wrench-downloader"
version = "26.4.3"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform download manager with browser interception and stream sniffing"
license = "MIT"

[[bin]]
name = "wrench-downloader"
path = "src/main.rs"

[dependencies]
# UI: GPUI Kit (GPUI + components + assets), cross-platform incl. Windows
gpui-kit = "0.10.0"

# Async runtime and networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json", "stream", "gzip", "brotli", "deflate", "rustls-tls", "charset", "http2",
] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "codec"] }
bytes = "1"
url = "2"

# Data / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
regex = "1"
tempfile = "3"
shell-words = "1"
async-trait = "0.1"
arboard = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
