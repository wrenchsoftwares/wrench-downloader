<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18191c;
      color: #f1f1f1;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2e3035;
    }
    .header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .app-status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2b593f;
      color: #6ee7b7;
      margin-left: auto;
    }
    .status-offline {
      background: #5c2828;
      color: #fca5a5;
    }
    .list {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      background: #222428;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background 0.15s;
    }
    .item:hover {
      background: #0078d4;
    }
    .item-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-url {
      font-size: 10px;
      color: #8f9298;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item:hover .item-url {
      color: #dbeafe;
    }
    .empty {
      text-align: center;
      padding: 24px 8px;
      color: #72767d;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🔧</span>
    <h3>Wrench Downloader</h3>
    <span id="appStatus" class="app-status">Checking App...</span>
  </div>
  <div class="list" id="mediaList">
    <div class="empty">No media detected on current tab yet.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
